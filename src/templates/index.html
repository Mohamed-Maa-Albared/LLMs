<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mo's Personal Assistant</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <!-- Anime.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- Marked.js Library for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <h2>Conversations</h2>
            <button id="new-conversation-btn">New Conversation</button>
            <ul id="conversation-list"></ul>
            <div id="delete-popup" class="popup">
                <p>Delete this conversation?</p>
                <div class="popup-actions">
                    <button id="cancel-popup" class="popup-button cancel">Cancel</button>
                    <button id="confirm-popup" class="popup-button danger">Delete</button>
                </div>
            </div>
        </div>
        <div class="right-panel">
            <h1>Mo's Personal Assistant</h1>
            <ul id="conversation-history"></ul>
            <form id="prompt-form">
                <div class="multi-action-container">
                    <button id="multi-action-btn" type="button" title="Add content">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                    </button>
                    <div class="action-dropdown">
                        <div class="action-option" data-action="file">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z" />
                            </svg>
                            <span>Upload File</span>
                        </div>
                        <div class="action-option" data-action="image">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z" />
                            </svg>
                            <span>Upload Image</span>
                        </div>
                        <div class="action-option" data-action="screenshot">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 2C10.34 2 9 3.34 9 5c0 .55.45 1 1 1s1-.45 1-1c0-.55.45-1 1-1s1 .45 1 1c0 .55.45 1 1 1s1-.45 1-1c0-1.66-1.34-3-3-3zm6.36 4H18c-.55 0-1 .45-1 1v2h-2V5c0-.55-.45-1-1-1h-4c-.55 0-1 .45-1 1v2H6v12h12V9h2V6.36zM12 15a3 3 0 100-6 3 3 0 000 6z" />
                            </svg>
                            <span>Take Screenshot</span>
                        </div>
                        <div class="action-option" data-action="voice">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z" />
                            </svg>
                            <span>Record Voice</span>
                        </div>
                    </div>
                    <input type="file" class="hidden-input" id="file-input">
                    <input type="file" accept="image/*" class="hidden-input" id="image-input">
                </div>
                <textarea id="prompt" name="prompt" placeholder="Ask LLaMA something..." required></textarea>
                <button type="submit">Send</button>
            </form>
            <!-- Settings Shelf -->
            <div id="settings-shelf">
                <img src="static/assets/settings.png" alt="Settings" id="settings-icon">
                <div id="settings-content">
                    <h2>Settings</h2>
                    <button id="dark-mode-toggle">Dark Mode</button>
                    <hr>
                    <div class="mode-slider">
                        <span>Precise</span>
                        <label class="switch">
                            <input type="checkbox" id="mode-toggle">
                            <span class="slider round"></span>
                        </label>
                        <span>Creative</span>
                    </div>
                    <hr>
                    <div class="checkbox-container">
                        <label for="include-history">
                            <input type="checkbox" id="include-history" checked>
                            Include conversation history
                        </label>
                    </div>
                    <hr>
                    <div class="model-selector">
                        <label for="model-select">Select Model:</label>
                        <select id="model-select">
                            <!-- Options will be dynamically inserted here -->
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- JavaScript File -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
